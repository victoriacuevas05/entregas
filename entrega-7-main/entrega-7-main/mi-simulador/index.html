<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <script defer src="js/main.js"></script>
<link rel="stylesheet" href="estilo/estilo.css">
</head>
<body>
 <header>
        <h1>Bienvenido a Film Journal</h1>
        <h3>Tu diario visual de pelis</h3>

        <p>
            Aquí podrás crear tu propio diario de cine, personalizar cada
            película con imágenes, colores, frases y stickers, y guardar
            tus reseñas y recuerdos para que cada página sea tan única
            como lo que te hizo sentir.
        </p>
    </header>

    <main>
        <section>
            <h2>Agregar una película</h2>

            <form id="formulario-pelicula">
                <label for="titulo">Título de la película:</label>
                <input type="text" id="titulo" required>

                <label for="genero">Género:</label>
                <input type="text" id="genero" required>

                <button type="submit" id="submit">
                    Agregar película
                </button>
            </form>

            <p id="mensaje" aria-live="polite"></p>
        </section>

        <section id="lista-peliculas">
            <h2>Mi colección</h2>

            <div id="contenedorpeliculas"></div>
        </section>
    </main>


</body>
</html>
